name: debug-apk

# Local-test builds of the fork: a debug-signed APK that installs next to the
# Play release (applicationIdSuffix ".debug"). No signing secrets needed.
on:
  push:
    branches: ['spectrum/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch proot
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libarchive-tools
          scripts/fetch-proot.sh

      # Unit tests first: FftTest runs on the JVM, no device needed.
      - name: Test
        run: ./gradlew :owl:test :app:testDebugUnitTest

      # NDK/CMake come from AGP auto-provisioning, same as release.yml: no
      # ndkVersion is pinned, and the release job builds wlbridge fine as-is.
      - name: Build
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: omalauncher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
